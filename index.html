<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajiv Gandhi College Admission Portal</title>
    
    <style>
	
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        ::selection {
            background: #f0442b;
            color: white;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5fa;
            color: #15345d;
            line-height: 1.6;
        }
        .banner {
            width: 100%;
			height:100px;
            position: sticky;
            top: 0;
            z-index:2;
            background: #052957;
            box-shadow: 0 4px 15px #001b3c35;
        }

        .banner img {
            width: 100%;
            height: 100%;
        }

        /* HERO SECTION */

        .hero {
            text-align: center;
            padding: 35px 15px 25px;
            background: linear-gradient(135deg, #ffffff, #eaf2ff);
            border-bottom: 3px solid #ed492e;
        }

        .hero h1 {
            font-size: clamp(24px, 4vw, 36px);
            color: #082c5b;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .hero p {
            color: #64748b;
            font-size: 15px;
        }

        .year {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 20px;
            border-radius: 30px;
            background: #ed492e;
            color: white;
            font-size: 13px;
            font-weight: bold;
        }

        /* PAGE LAYOUT */

        .layout {
            width: min(1200px, 94%);
            margin: 35px auto;
            display: grid;
            grid-template-columns: 230px minmax(0, 1fr);
            gap: 25px;
            align-items: start;
        }

        /* LEFT SIDEBAR */

        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 25px 18px;
            box-shadow: 0 5px 22px #17395c12;
            position: sticky;
            top: 185px;
        }

        .sidebar h3 {
            font-size: 16px;
            margin-bottom: 22px;
            color: #082c5b;
        }

        .steps {
            list-style: none;
            counter-reset: step;
        }

        .steps li {
            counter-increment: step;
            position: relative;
            padding: 0 0 25px 43px;
            color: #536985;
            font-size: 13px;
        }

        .steps li::before {
            content: counter(step);
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #e6edf7;
            color: #15345d;
            font-weight: bold;
        }
        .steps li:not(:last-child)::after {
            content: "";
            position: absolute;
            left: 14px;
            top: 32px;
            width: 2px;
            height: 20px;
            background: #d5dfed;
        }

        .steps li:first-child::before {
            background: #ed492e;
            color: white;
        }

        .steps a {
            color: inherit;
            text-decoration: none;
        }

        .steps a:hover {
            color: #ed492e;
        }

        .sidebar-note {
            margin-top: 10px;
            padding: 15px;
            border-radius: 8px;
            background: #fff1ed;
            color: #a63220;
            font-size: 12px;
        }

        /* FORM CONTAINER */

        .form-container {
            min-width: 0;
            padding: 25px;
            border-radius: 14px;
            background: white;
            box-shadow: 0 8px 30px #17395c16;
        }

        .section {
            border-bottom: 1px solid #e0e8f3;
			width:100%;
        }

        .section:first-child {
            padding-top: 0;
        }

        .section:last-of-type {
            border-bottom: none;
        }

        .section-heading {
            display: flex;
            align-items: center;
            gap: 13px;
            margin-bottom: 22px;
        }

        .section-icon {
            width: 45px;
            height: 45px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: #fff0ec;
            color: #ed492e;
            font-size: 23px;
        }

        .section-heading h2 {
            font-size: 20px;
            color: #082c5b;
        }

        .section-heading p {
            color: #718198;
            font-size: 12px;
        }

        .part-number {
            margin-left: auto;
            padding: 5px 12px;
            border-radius: 20px;
            background: #082c5b;
            color: white;
            font-size: 11px;
            white-space: nowrap;
        }

        /* INPUT GRID */

        .fields {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .field label,
        .group-title {
            display: block;
            margin-bottom: 7px;
            color: #263d5c;
            font-size: 13px;
            font-weight: bold;
        }

        .field label::after {
            content: "";
        }

        .field:has(input:required) label::after,
        .field:has(select:required) label::after,
        .field:has(textarea:required) label::after {
            content: " *";
            color: #ed492e;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd8e8;
            border-radius: 7px;
            outline: none;
            background: #fafdff;
            color: #15345d;
            font: inherit;
            font-size: 13px;
            transition: border-color .2s, box-shadow .2s,
                        background .2s;
        }

        input::placeholder,
        textarea::placeholder {
            color: #91a1b6;
            font-size: 12px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #ed492e;
            background: white;
            box-shadow: 0 0 0 3px #ed492e18;
        }

        input:required,
        select:required,
        textarea:required {
            border-left: 3px solid #e9a293; 	
        }

        input:disabled,
        select:disabled,
        textarea:disabled {
            background: #e9edf3;
            color: #8995a5;
            cursor: not-allowed;
        }

        input:valid:not(:placeholder-shown) {
            border-color: #91bfa2;
        }

        .full {
            grid-column: 1 / -1;
        }

        textarea {
            resize: vertical;
            min-height: 95px;
        }

        /* RADIO AND CHECKBOX GROUPS */

        .choice-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .choice {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 10px 13px;
            border: 1px solid #d5dfed;
            border-radius: 7px;
            background: #fafdff;
            font-size: 13px;
            cursor: pointer;
            transition: .2s;
        }

        .choice input {
            width: auto;
            accent-color: #ed492e;
        }

        .choice:has(input:checked) {
            border-color: #ed492e;
            background: #fff1ed;
            color: #a63220;
        }

        .choice:hover {
            border-color: #ed492e;
        }

        /* DOCUMENT UPLOAD */

        .upload-box {
            padding: 18px;
            border: 2px dashed #b8c9df;
            border-radius: 9px;
            background: #f7faff;
        }

        .upload-box input {
            padding: 10px;
            background: white;
        }

        .upload-box p {
            margin-top: 7px;
            color: #7b8ba1;
            font-size: 11px;
        }

        /* DOCUMENT CHECKLIST */

        .document-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .document-list label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border: 1px solid #dce5f0;
            border-radius: 7px;
            background: #fafdff;
            font-size: 12px;
            cursor: pointer;
        }

        .document-list input {
            width: auto;
            accent-color: #ed492e;
        }

        .document-list label:has(input:checked) {
            background: #fff1ed;
            border-color: #ed492e;
        }

        /* DECLARATION */

        .declaration {
            padding: 17px;
            border: 1px solid #ffd6cc;
            border-radius: 9px;
            background: #fff7f4;
            color: #65443e;
            font-size: 13px;
        }

        .declaration p:first-child::first-letter {
            color: #ed492e;
            font-size: 25px;
            font-weight: bold;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
            color: #344b67;
            font-size: 13px;
        }

        .terms input {
            width: auto;
            margin-top: 5px;
            accent-color: #ed492e;
        }

        .terms a {
            color: #d53c25;
        }

        .terms a:visited {
            color: #7044a3;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
            padding-top: 20px;
        }

        button {
            padding: 12px 23px;
            border: 1px solid #ed492e;
            border-radius: 7px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: .25s;
        }

        button:active {
            transform: scale(.97);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .submit {
            background: #ed492e;
            color: white;
        }

        .submit::after {
            content: "  →";
        }

        .submit:hover {
            background: #c9321b;
            box-shadow: 0 5px 14px #ed492e35;
            transform: translateY(-2px);
        }

        .reset {
            background: white;
            color: #ed492e;
        }

        .reset:hover {
            background: #fff1ed;
        }

        .hint {
            margin-top: 15px;
            color: #78899f;
            font-size: 11px;
        }

        /* FOOTER */

        footer {
            padding: 25px 15px;
            background: #052957;
            color: white;
            text-align: center;
            font-size: 12px;
            line-height: 2;
        }

        footer strong {
            font-size: 15px;
        }

        footer p:last-child {
            color: #ffc078;
        }

        /* RESPONSIVE DESIGN */

        @media (max-width: 850px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
            }

            .steps {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .steps li {
                padding-bottom: 8px;
            }

            .steps li::after {
                display: none;
            }
        }

        @media (max-width: 550px) {
            .banner img {
                min-height: 70px;
                object-fit: contain;
            }

            .hero {
                padding: 25px 12px;
            }

            .layout {
                width: 94%;
                margin: 20px auto;
                gap: 15px;
            }

            .sidebar,
            .form-container {
                padding: 18px;
            }

            .fields,
            .document-list {
                grid-template-columns: 1fr;
            }

            .section-heading h2 {
                font-size: 17px;
            }

            .part-number {
                font-size: 10px;
                padding: 4px 8px;
            }

            .choice-group {
                align-items: stretch;
            }

            .choice {
                width: 100%;
            }

            .buttons {
                flex-direction: column;
            }

            .buttons button {
                width: 100%;
            }
        }

			<a href="">Home</a>

			|

		<section class="form1">
                <section class="section" id="personal">

                    <div class="section-heading">
                        <div class="section-icon">👤</div>
                        <div>
                            <h2>Personal Information</h2>
                            <p>Please enter your basic details.</p>
                        </div>
                        <span class="part-number">PART 1 OF 4</span>
                    </div>

                    <div class="fields">

                        <div class="field">
                            <label for="name">Full Name</label>
                            <input id="name" name="name"
                                   type="text"
                                   placeholder="Enter your full name"
                                   autocomplete="name"
                                   required>
                        </div>

                        <div class="field">
                            <label for="dob">Date of Birth</label>
                            <input id="dob" name="dob"
                                   type="date" required>
                        </div>

                        <div class="field">
                            <label for="gender">Gender</label>
                            <select id="gender" name="gender" required>
                                <option value="">Select gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                                <option value="undisclosed">Prefer not to say</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="email">Email Address</label>
                            <input id="email" name="email"
                                   type="email"
                                   placeholder="example@gmail.com"
                                   autocomplete="email"
                                   required>
                        </div>

                        <div class="field">
                            <label for="mobile">Mobile Number</label>
                            <input id="mobile" name="mobile"
                                   type="tel"
                                   pattern="[0-9]{10}"
                                   maxlength="10"
                                   inputmode="numeric"
                                   placeholder="10-digit mobile number"
                                   autocomplete="tel"
                                   required>
                        </div>

                        <div class="field">
                            <label for="guardian">Parent / Guardian Name</label>
                            <input id="guardian" name="guardian"
                                   type="text"
                                   placeholder="Enter guardian's name"
                                   required>
                        </div>

                        <div class="field full">
                            <label for="address">Full Address</label>
                            <textarea id="address" name="address"
                                      placeholder="House number, street, area"
                                      autocomplete="street-address"
                                      required></textarea>
                        </div>

                        <div class="field">
                            <label for="city">City</label>
                            <input id="city" name="city"
                                   type="text"
                                   placeholder="Enter your city"
                                   required>
                        </div>

                        <div class="field">
                            <label for="state">State</label>
                            <select id="state" name="state" required>
                                <option value="">Select state</option>
                                <option>Maharashtra</option>
                                <option>Madhya Pradesh</option>
                                <option>Gujarat</option>
                                <option>Telangana</option>
                                <option>Karnataka</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="pin">PIN Code</label>
                            <input id="pin" name="pin"
                                   type="text"
                                   pattern="[0-9]{6}"
                                   maxlength="6"
                                   inputmode="numeric"
                                   placeholder="6-digit PIN code"
                                   required>
                        </div>
                    </div>
                </section>
		</section>
    </main>
</body>
